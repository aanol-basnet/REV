name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The server imports the shared schemas from their build output.
      - run: npm run build -w @rev/schemas
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/REV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew test lintDebug assembleDebug --console=plain
      - name: Keep reports and the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/REV/app/build/outputs/apk/debug/*.apk
            android/REV/wear/build/outputs/apk/debug/*.apk
            android/REV/**/build/reports/
          retention-days: 14
          if-no-files-found: ignore
